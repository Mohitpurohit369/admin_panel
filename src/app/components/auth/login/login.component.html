<div class="page-wrapper">
  <div class="authentication-box">
    <div class="container">
      <div class="row">
        <div class="">
          <div class="card tab2-card card-login">
            <div class="card-body">
              <ul class="nav nav-tabs nav-material">
                <li class="nav-item">
                  <a class="nav-link" 
                     [ngClass]="{'active': activeTab === 'login'}"
                     (click)="switchTab('login')">
                    <span class="icon-user me-2"></span>Login
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" 
                     [ngClass]="{'active': activeTab === 'register'}"
                     (click)="switchTab('register')">
                    <span class="icon-unlock me-2"></span>Register
                  </a>
                </li>
              </ul>

              <div class="tab-content">
                <!-- Login Tab -->
                <div class="tab-pane fade" [ngClass]="{'show active': activeTab === 'login'}">
                  <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
                    <div class="form-group">
                      <input type="email" formControlName="email" class="form-control" placeholder="Email">
                      <div *ngIf="loginForm.controls['email'].invalid && loginForm.controls['email'].touched" class="text-danger">
                        Valid email is required.
                      </div>
                    </div>
                    <div class="form-group">
                      <input type="password" formControlName="password" class="form-control" placeholder="Password">
                      <div *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched" class="text-danger">
                        Password must be at least 6 characters.
                      </div>
                    </div>
                    <!-- <div class="form-terms">
                      <input type="checkbox" formControlName="rememberMe">
                      <label>Remember me</label>
                      <a href="javascript:void(0)">Forgot Password?</a>
                    </div> -->
                    <div class="form-button">
                      <button class="btn btn-primary" type="submit" >Login</button>
                      <!-- [disabled]="loginForm.invalid" -->
                    </div>
                  </form>
                </div>

                <!-- Register Tab -->
                <div class="tab-pane fade" [ngClass]="{'show active': activeTab === 'register'}">

                    </div>
                    <div class="form-group">

                      </div>
                    </div>
                    <div class="form-terms">
                      <input type="checkbox" formControlName="agreeTerms">
                      <label>I agree to <a href="#">Terms & Conditions</a></label>
                    </div>
                    <div class="form-button">
                      <button class="btn btn-primary" type="submit" [disabled]="registerForm.invalid">Register</button>
                    </div>
                  </form> -->


                  <form [formGroup]="registerForm" (ngSubmit)="onRegisterSubmit()">
                    <div class="form-group">
                      <label>Name</label>
                      <input type="text" formControlName="name" class="form-control">
                      <div *ngIf="registerForm.controls['name'].invalid && registerForm.controls['name'].touched" class="text-danger">
                        Name is required.
                      </div>
                    </div>
                
                    <div class="form-group">
                      <label>Email</label>
                      <input type="email" formControlName="email" class="form-control">
                      <div *ngIf="registerForm.controls['email'].invalid && registerForm.controls['email'].touched" class="text-danger">
                        Enter a valid email.
                      </div>
                    </div>
                
                    <div class="form-group">
                      <label>Password</label>
                      <input type="password" formControlName="password" class="form-control">
                      <div *ngIf="registerForm.controls['password'].invalid && registerForm.controls['password'].touched" class="text-danger">
                        Password must be 8-12 characters with uppercase, lowercase, number, and special character.
                      </div>
                    </div>
                
                    <div class="form-group">
                      <label>Image Upload</label>
                      <input type="file" (change)="onImageUpload($event)" class="form-control">
                      <div *ngIf="registerForm.controls['image'].invalid && registerForm.controls['image'].touched" class="text-danger">
                        Image is required.
                      </div>
                      <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview" class="img-thumbnail mt-2" width="100">
                    </div>
                
                    <div class="form-group">
                      <label>Mobile</label>
                      <input type="text" formControlName="mobile" class="form-control">
                      <div *ngIf="registerForm.controls['mobile'].invalid && registerForm.controls['mobile'].touched" class="text-danger">
                        Enter a valid 10-digit mobile number.
                      </div>
                    </div>
                
                    <div class="form-group">
                      <label>Type</label>
                      <input type="number" formControlName="type" class="form-control">
                      <div *ngIf="registerForm.controls['type'].invalid && registerForm.controls['type'].touched" class="text-danger">
                        Type is required.
                      </div>
                    </div>
                
                    <button class="btn btn-primary mt-3" type="submit" [disabled]="registerForm.invalid">Submit</button>
                  </form>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
      <!-- <a  class="btn btn-primary back-btn">Back</a> -->
    </div>
  </div>
</div>
