<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-header">
                <form class="form-inline search-form search-box">
                  <div class="form-group">
                    <input class="form-control-plaintext" type="search" placeholder="Search..">
                  </div>
                </form>
                <button type="button" class="btn btn-primary mt-md-0 mt-2" (click)="addCategory()">Add Subcategory</button>
              </div>
          
              <div *ngIf="showcategort" class="modal fade show d-block">
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title f-w-600">Add Physical Product</h5>
                      <button class="btn-close" type="button" (click)="closeModal()"><span></span></button>
                    </div>
                    <div class="modal-body">
                        <form [formGroup]="sub_categoryForm" (ngSubmit)="onSubmit()">
                            <div class="form">
                              
                              <div class="form-group">
                                <label class="mb-1">Category Name:</label>
                                <select class="form-control" formControlName="category_id">
                                  <option value="">Select a Category</option>
                                  <option *ngFor="let cat of categories" [value]="cat._id">{{ cat.category }}</option>
                                </select>
                                <div *ngIf="sub_categoryForm.controls['category_id'].invalid && sub_categoryForm.controls['category_id'].touched" class="text-danger">
                                  Category Name is required.
                                </div>
                              </div>
                          
                              <div class="form-group">
                                <label class="mb-1">Sub Category Name:</label>
                                <input class="form-control" type="text" formControlName="sub_category">
                                <div *ngIf="sub_categoryForm.controls['sub_category'].invalid && sub_categoryForm.controls['sub_category'].touched" class="text-danger">
                                  Sub Category Name is required.
                                </div>
                              </div>
                          
                              <div class="form-group">
                                <label class="mb-1">Sub Category Image:</label>
                                <input class="form-control" type="file" (change)="upload($event)">
                                <div *ngIf="sub_categoryForm.controls['images']?.invalid && sub_categoryForm.controls['images']?.touched" class="text-danger">
                                  Please select an image.
                                </div>
                              </div>
                          
                              <div class="modal-footer">
                                <button class="btn btn-primary" type="submit" [disabled]="sub_categoryForm.invalid">Save</button>
                                <button class="btn btn-secondary" type="button" (click)="closeModal()">Close</button>
                              </div>
                            </div>
                          </form>
                          
                          
                          
                    </div>
                  </div>
                </div>
              </div>
