<div class="container-fluid">
    <div class="row">
        <div class="col-sm-12">
            <div class="card">
              <div class="card-header">
                <h5> Add Product </h5>
            </div>
                <div class="card-body">
                    <div class="row product-adding">
                        <div class="col-xl-5">
                            <div class="add-product">
                              <div class="row">
                                <div class="col-xl-9 xl-50 col-sm-6 col-9">
                                        <img alt="Product Image" [src]="bigImage"  class="img-fluid image_zoom_1">
                                </div>
                                <div class="col-xl-3 xl-50 col-sm-6 col-3">
                                    <ul class="file-upload-product">
                                        <li *ngFor="let item of url;let i=index">
                                            <div class="box-input-file">
                                                <input class="upload" type="file" #file
                                                    (change)="upload(file.files,i)" />
                                                <img class="imgUpload" [src]="item.img" />
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            </div>
                        </div>
                        <div class="col-xl-7">

                            <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
                                <div class="form">
                              
                                  <!-- Name -->
                                  <div class="form-group mb-3 row">
                                    <label class="col-xl-3 col-sm-4">Name:</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <input class="form-control" type="text" formControlName="name">
                                      <div *ngIf="productForm.controls['name'].invalid && productForm.controls['name'].touched" class="text-danger">
                                        Name is required.
                                      </div>
                                    </div>
                                  </div>
                              
                                  <!-- Title -->
                                  <div class="form-group mb-3 row">
                                    <label class="col-xl-3 col-sm-4">Title:</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <input class="form-control" type="text" formControlName="title">
                                      <div *ngIf="productForm.controls['title'].invalid && productForm.controls['title'].touched" class="text-danger">
                                        Title is required.
                                      </div>
                                    </div>
                                  </div>
                              
                                  <!-- Product Code -->
                                  <div class="form-group mb-3 row">
                                    <label class="col-xl-3 col-sm-4">Product Code:</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <input class="form-control" type="text" formControlName="productCode">
                                      <div *ngIf="productForm.controls['productCode'].invalid && productForm.controls['productCode'].touched" class="text-danger">
                                        Must be at least 3 characters.
                                      </div>
                                    </div>
                                  </div>
                              
                                  <!-- Price -->
                                  <div class="form-group mb-3 row">
                                    <label class="col-xl-3 col-sm-4">Price:</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <input class="form-control" type="text" formControlName="price">
                                      <div *ngIf="productForm.controls['price'].invalid && productForm.controls['price'].touched" class="text-danger">
                                        Enter a valid price.
                                      </div>
                                    </div>
                                  </div>
                              
                                  <!-- Sale Price -->
                                  <div class="form-group mb-3 row">
                                    <label class="col-xl-3 col-sm-4">Sale Price:</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <input class="form-control" type="text" formControlName="salePrice">
                                      <div *ngIf="productForm.controls['salePrice'].invalid && productForm.controls['salePrice'].touched" class="text-danger">
                                        Enter a valid sale price.
                                      </div>
                                    </div>
                                  </div>
                              
                                  <!-- Discount -->
                                  <div class="form-group mb-3 row">
                                    <label class="col-xl-3 col-sm-4">Discount (%):</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <input class="form-control" type="text" formControlName="discount">
                                      <div *ngIf="productForm.controls['discount'].invalid && productForm.controls['discount'].touched" class="text-danger">
                                        Must be between 0 and 100.
                                      </div>
                                    </div>
                                  </div>
                              
                                  <!-- Size Selection -->
                                  <div class="form-group row">
                                    <label class="col-xl-3 col-sm-4">Size:</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <select class="form-control" formControlName="size">
                                        <option value="">Select Size</option>
                                        <option *ngFor="let size of objSizes" [value]="size._id">{{size.size}}</option>
                                      </select>
                                    </div>
                                  </div>
                              
                                  <!-- Category -->
                                  <div class="form-group row">
                                    <label class="col-xl-3 col-sm-4">Category:</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <select class="form-control" formControlName="category_id">
                                        <option value="">Select Category</option>
                                        <option *ngFor="let category of objCategories" [value]="category._id">{{category.category}}</option>
                                      </select>
                                    </div>
                                  </div>
                              
                                  <!-- Sub Category -->
                                  <div class="form-group row">
                                    <label class="col-xl-3 col-sm-4">Sub Category:</label>
                                    <div class="col-xl-8 col-sm-7">
                                        <select class="form-control" formControlName="sub_category_id">
                                            <option value="">Select Category</option>
                                            <option *ngFor="let subCategory of objsubCategories" [value]="subCategory._id">{{subCategory.sub_category}}</option>
                                          </select>
                                    </div>
                                  </div>


                                  <div class="form-group row">
                                    <label class="col-xl-3 col-sm-4">Tag:</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <select class="form-control" formControlName="tag">
                                        <option value="">Select Category</option>
                                        <option *ngFor="let category of objTags" [value]="category._id">{{category.name}}</option>
                                      </select>
                                    </div>
                                  </div>


                                  <div class="form-group row">
                                    <label class="col-xl-3 col-sm-4">Color:</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <select class="form-control" formControlName="color">
                                        <option value="">Select Color</option>
                                      <option *ngFor="let category of objColors" [value]="category._id">{{category.name}}</option>
                                      </select>
                                    </div>
                                  </div>
                              
                                  <!-- Quantity -->
                                  <div class="form-group row">
                                    <label class="col-xl-3 col-sm-4 mb-0">Total Products :</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <input class="form-control" type="number" formControlName="total_products">
                                      <div *ngIf="productForm.controls['total_products'].invalid && productForm.controls['total_products'].touched" class="text-danger">
                                        Enter a valid number of products.
                                      </div>
                                    </div>
                                  </div>
                              
                                  <!-- Description -->
                                  <div class="form-group row">
                                    <label class="col-xl-3 col-sm-4">Description:</label>
                                    <div class="col-xl-8 col-sm-7">
                                      <textarea class="form-control" formControlName="description"></textarea>
                                    </div>
                                  </div>
                              
                                  <!-- Submit Button -->
                                  <div class="form-group row">
                                    <div class="col-xl-8 col-sm-7 offset-xl-3 offset-sm-4 mt-4">
                                      <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">Add</button>
                                      <button type="button" class="btn btn-light">Discard</button>
                                    </div>
                                  </div>
                                </div>
                              </form>
